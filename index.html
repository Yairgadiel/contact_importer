<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="title"></title>
  <meta name="description" content="סרוק תמונות בעברית, מפה את השורות שזוהו לשדות קשר וייצא קובץ vCard.">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ייבוא אנשי קשר">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='104'%20fill='%230891b2'/%3E%3Crect%20x='112'%20y='96'%20width='288'%20height='320'%20rx='24'%20fill='%230f172a'/%3E%3Crect%20x='112'%20y='96'%20width='288'%20height='320'%20rx='24'%20fill='none'%20stroke='%2322d3ee'%20stroke-width='24'/%3E%3Ccircle%20cx='256'%20cy='200'%20r='56'%20fill='%23e2e8f0'/%3E%3Cpath%20d='M160%20352c16-56%2052-84%2096-84s80%2028%2096%2084v16H160z'%20fill='%237dd3fc'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen font-sans text-slate-100">

  <header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-900/80 backdrop-blur">
    <div class="mx-auto flex max-w-md items-center justify-between gap-3 px-4 py-3">
      <div>
        <h1 class="text-base font-bold leading-tight" data-i18n="app.name"></h1>
        <p class="text-xs text-slate-400" data-i18n="app.tagline"></p>
      </div>
      <button id="configBtn" type="button" data-i18n-aria="app.config"
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-800 text-slate-300 ring-1 ring-slate-700 transition hover:text-cyan-300 hover:ring-cyan-500/40">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-md px-4 pb-24">

    <!-- Scan -->
    <section id="scanSection" class="mt-4">
      <button id="dropzone" type="button"
        class="group w-full rounded-2xl border-2 border-dashed border-slate-700 bg-slate-800/50 p-6 text-center transition hover:border-cyan-500/60 hover:bg-slate-800">
        <input id="fileInput" type="file" accept="image/*" class="hidden">
        <div class="flex flex-col items-center gap-2">
          <div class="flex h-14 w-14 items-center justify-center rounded-full bg-cyan-500/10 text-cyan-400 transition group-hover:scale-105">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/>
            </svg>
          </div>
          <p class="text-sm font-medium text-slate-200" data-i18n="scan.title"></p>
          <p class="text-xs text-slate-400" data-i18n="scan.formats"></p>
          <img id="preview" class="mt-2 hidden max-h-40 rounded-xl object-contain ring-1 ring-slate-700" alt="" data-i18n-aria="scan.title">
        </div>
      </button>

        <button id="cameraBtn" type="button"
          class="mt-2 w-full rounded-xl bg-slate-800 py-2.5 text-sm font-medium text-cyan-300 ring-1 ring-slate-700 transition hover:ring-cyan-500/40"
          data-i18n="scan.camera">
        </button>
      <input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden">

      <button id="analyzeBtn" type="button" disabled
        class="mt-3 w-full rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 py-3 text-base font-bold text-white shadow-lg shadow-cyan-500/20 transition active:scale-[0.98] disabled:opacity-40 disabled:shadow-none"
        data-i18n="scan.analyze">
      </button>
      <p class="mt-1 text-center text-[11px] text-slate-500" data-i18n="scan.analyze_note"></p>

      <div id="status" class="mt-3 hidden text-sm"></div>
      <div id="spinner" style="display:none" class="mt-3 flex-col items-center gap-2">
        <svg class="h-6 w-6 animate-spin text-cyan-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <p class="text-sm text-slate-400" data-i18n="scan.loading"></p>
      </div>
    </section>

    <!-- Results / Mapping -->
    <section id="resultsSection" class="mt-6 hidden">
      <div class="mb-3">
        <h2 class="text-lg font-bold" data-i18n="results.title"></h2>
        <p class="mt-1 text-xs text-slate-400" data-i18n="results.hint"></p>
      </div>

      <div id="resultsMeta" class="mb-3 hidden">
        <span class="rounded-full bg-cyan-500/10 px-2.5 py-1 text-[11px] font-medium text-cyan-300 ring-1 ring-cyan-500/30" id="resultsCount"></span>
      </div>

      <div id="resultsForm" class="space-y-3"></div>

      <div class="mt-5 flex flex-col gap-2">
        <button id="saveContactBtn" type="button"
          class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 py-3 text-base font-bold text-white shadow-lg shadow-emerald-500/20 transition active:scale-[0.98]">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"/>
          </svg>
          <span data-i18n="results.save"></span>
        </button>
        <button id="resetBtn" type="button"
          class="w-full rounded-xl bg-slate-800 py-3 font-semibold text-slate-300 ring-1 ring-slate-700 transition hover:ring-slate-500"
          data-i18n="results.new_scan">
        </button>
      </div>

      <p id="iosHintLabel" class="mt-3 mb-1 hidden text-[11px] font-semibold text-slate-400"></p>

      <div id="multiContactHint" class="hidden rounded-xl bg-amber-500/10 px-3 py-2 ring-1 ring-amber-500/20">
        <div class="flex items-start gap-2">
          <span class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-cyan-500/20 text-cyan-300">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          </span>
          <p id="multiContactHintText" class="text-[11px] leading-relaxed text-amber-300"></p>
        </div>
      </div>

      <div id="multiContactHintWa" class="mt-2 hidden rounded-xl bg-emerald-500/10 px-3 py-2 ring-1 ring-emerald-500/20">
        <div class="flex items-start gap-2">
          <span class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-emerald-500/20 text-[#25D366]">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
          </span>
          <p id="multiContactHintWaText" class="text-[11px] leading-relaxed text-emerald-300"></p>
        </div>
      </div>
    </section>

    <footer class="mt-8 whitespace-pre-line border-t border-slate-800/60 pt-4 text-center text-[11px] leading-relaxed text-slate-600">
      <p data-i18n="footer.text"></p>
      <p class="mt-1 text-slate-700" data-i18n="app.version"></p>
    </footer>
  </main>

  <!-- Config modal -->
  <div id="configModal" class="fixed inset-0 z-30 hidden">
    <div class="absolute inset-0 bg-black/60" data-close-config></div>
    <div class="absolute inset-x-0 bottom-0 max-h-[85vh] overflow-y-auto overscroll-contain rounded-t-2xl border-t border-slate-700 bg-slate-900 p-5">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold" data-i18n="config.title"></h3>
        <button id="closeConfigBtn" type="button" data-i18n-aria="config.close"
          class="flex h-9 w-9 items-center justify-center rounded-lg bg-slate-800 text-slate-400 ring-1 ring-slate-700 transition hover:text-slate-200">
          ✕
        </button>
      </div>
      <p class="mt-1 text-xs text-slate-400" data-i18n="config.subtitle"></p>

      <h4 class="mb-2 mt-5 text-sm font-semibold text-cyan-400" data-i18n="config.standard_title"></h4>
      <div id="standardFields" class="grid grid-cols-2 gap-2"></div>

      <h4 class="mb-2 mt-5 text-sm font-semibold text-cyan-400" data-i18n="config.custom_title"></h4>
      <div id="customFieldsList" class="space-y-2"></div>
      <button id="addCustomBtn" type="button"
        class="mt-2 w-full rounded-lg border border-dashed border-slate-600 py-2 text-sm text-slate-300 transition hover:border-cyan-500/60 hover:text-cyan-300"
        data-i18n="config.add_custom">
      </button>

      <div class="mt-5 flex gap-2">
        <button id="saveConfigBtn" type="button" class="flex-1 rounded-xl bg-cyan-500 py-3 font-bold text-slate-900 transition active:scale-[0.98]" data-i18n="config.save"></button>
        <button id="cancelConfigBtn" type="button" class="flex-1 rounded-xl bg-slate-800 py-3 font-semibold text-slate-300 ring-1 ring-slate-700" data-i18n="config.cancel"></button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed inset-x-0 bottom-6 z-40 flex justify-center px-4">
    <div id="toastInner" class="hidden rounded-lg bg-slate-800 px-4 py-2 text-sm text-slate-100 shadow-xl ring-1 ring-slate-600"></div>
  </div>

  <script src="i18n.js" defer></script>
  <script src="app.js" defer></script>
  
</body>
</html>
