name: version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version with push time
        env:
          TZ: Asia/Jerusalem
        run: node scripts/stamp-version.js

      - name: Commit and push if changed
        run: |
          git config user.name "version-bot"
          git config user.email "version-bot@users.noreply.github.com"
          git add i18n.js
          if ! git diff --cached --quiet; then
            git commit -m "Update version timestamp"
            git push
          fi
